name: Release

# Publishing a GitHub release (tag vX.Y.Z, matching the version in pom.xml) builds the jar,
# attaches it with a checksum, and publishes the package to GitHub Packages.
on:
  release:
    types: [published]

permissions:
  contents: write   # attach files to the release
  packages: write   # publish to GitHub Packages

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Check the tag matches the pom version
        run: |
          VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match pom version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: mvn -B -ntp verify

      - name: Verify Java 8 bytecode
        run: bash .github/scripts/check-bytecode.sh target/classes

      - name: Checksum
        run: |
          cd target
          sha256sum "TasfiqUnloader-${VERSION}.jar" > "TasfiqUnloader-${VERSION}.jar.sha256"

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "target/TasfiqUnloader-${VERSION}.jar" \
            "target/TasfiqUnloader-${VERSION}.jar.sha256" \
            --clobber

      - name: Publish to GitHub Packages
        run: mvn -B -ntp deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
