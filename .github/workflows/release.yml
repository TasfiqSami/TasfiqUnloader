name: Release

# Push a tag like v3.0.0 (it must match the version in pom.xml) to publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # publish to GitHub Packages

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Check the tag matches the pom version
        run: |
          VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: mvn -B -ntp verify

      - name: Verify Java 8 bytecode
        run: bash .github/scripts/check-bytecode.sh target/classes

      - name: Checksum
        run: |
          cd target
          sha256sum "TasfiqUnloader-${VERSION}.jar" > "TasfiqUnloader-${VERSION}.jar.sha256"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = (index($0, "[" v "]") > 0); next } p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry for $VERSION, falling back to generated notes."
            rm -f release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ -f release-notes.md ]; then
            flags+=(--notes-file release-notes.md)
          else
            flags+=(--generate-notes)
          fi
          case "$VERSION" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "target/TasfiqUnloader-${VERSION}.jar" \
            "target/TasfiqUnloader-${VERSION}.jar.sha256" \
            --title "TasfiqUnloader ${VERSION}" \
            "${flags[@]}"

      - name: Publish to GitHub Packages
        run: mvn -B -ntp deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
