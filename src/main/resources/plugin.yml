name: TasfiqUnloader
version: '${project.version}'
main: io.github.tasfiqsami.tasfiqunloader.TasfiqUnloader
# 1.13 is the lowest value modern servers accept; it stops them treating the plugin as legacy.
# Servers older than 1.13 ignore this key, so one jar works from 1.8 to 26.x.
api-version: '1.13'
description: Hibernates the server and unloads chunks while nobody is online.
authors: [Tasfiq]
website: https://github.com/TasfiqSami/TasfiqUnloader

commands:
  hibernate:
    description: Toggle, check or reload TasfiqUnloader
    usage: /<command> [toggle|status|reload]
    aliases: [tasfiqunloader]
    permission: tasfiqunloader.toggle
    permission-message: You do not have the required permission (<permission>)

permissions:
  tasfiqunloader.toggle:
    description: Allows using /hibernate
    default: op
